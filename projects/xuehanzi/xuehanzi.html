<!DOCTYPE html>
<html lang="vn">
	<head>
		<meta charset="UTF-8">
		<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
		<meta content="width=device-width, initial-scale=1.0" name="viewport">
		<link rel="icon" href="https://hiepdeep.github.io/library/pictures/favicon/globe_book_48dp_1F1F1F_FILL0_wght100_GRAD200_opsz48.png">
		<link rel="apple-touch-icon" href="icon.png">
		<title>𝐗𝐮𝐞𝐇𝐚𝐧𝐳𝐢</title>
		<link rel="stylesheet" href="https://hiepdeep.github.io/library/style/style.css">
		<style type="text/css">
			::-webkit-scrollbar {
				width: 0;
				height: 0;
			}
			body {
				font-family: "Quicksand", sans-serif;
				font-size: var(--fz-lv-4);
				color: red;
				background: hsl(39, 47%, 96%);
			}
			.app {
				width: 100%;
				.app-header_container, .app-main_container {
					max-width: 1080px;
					margin: 0 auto;
				}
				.app-header {
					width: 100%;
					background: var(--bg-box);
					border-bottom: 1px solid var(--bd-box);
					position: sticky;
					top: 0;
					left: 0;
					z-index: 9999;
					.app-header_container {
						padding: 12px;
						display: flex;
						justify-content: space-between;
						align-items: center;
						gap: 12px;
						.app-header_container_logo {
							display: flex;
							align-items: center;
							gap: 12px;
							.app-header_container_logo_img {
								width: auto;
								height: 30px;
							}
							.app-header_container_logo_text {
								color: var(--color-lv-1);
								font-size: var(--fz-lv-1);
								font-weight: 600;
							}
						}
					}
				}
				.app-main {
					.app-main_data_dashboard {
						width: 100%;
						background: var(--bg-box);
						border-bottom: 1px solid var(--bd-box);
						position: sticky;
						top: 0;
						left: 0;
						z-index: 9999;
						.app-main_container {
							.data_dashboard_header {
								display: flex;
								justify-content: space-between;
								align-items: center;
								gap: 6px;
								.data_dashboard_header {
									display: flex;
									align-items: center;
									gap: 6px;
									.data_dashboard_header_icon {
										font-variation-settings: "FILL" 1, "wght" 200, "GRAD" 200, "opsz" 48;
										width: 30px;
										line-height: 30px;
										text-align: center;
										font-size: 20px;
										color: hsl(var(--hue-saturation-blue), 30%);
										background: hsl(var(--hue-saturation-blue), 90%);
										border: 1px solid hsl(var(--hue-saturation-blue), 85%);
										border-radius: var(--bdrs-lv-3);
									}
									.data_dashboard_header_label {
										color: var(--color-lv-2);
										font-size: var(--fz-lv-2);
										font-weight: 600;
										strong {
											font-weight: 700;
										}
									}
								}
								.favorites-btn {
									display: flex;
									align-items: center;
									gap: 2px;
									padding: 2px 6px;
									border-radius: var(--bdrs-lv-3);
									#data_dashboard_header_favorites {
										font-family: "Quicksand", sans-serif;
										font-weight: 500;
									}
									.data_dashboard_header_icon {
										font-variation-settings: "FILL" 1, "wght" 200, "GRAD" 200, "opsz" 48;
										font-size: 20px;
									}
								}
							}
							.data_dashboard_progress {
								display: flex;
								flex-direction: column;
								gap: 6px;
								.data_dashboard_progress_header {
									display: flex;
									justify-content: space-between;
									align-items: center;
									gap: 6px;
									#data_dashboard_progress_count {
										color: var(--color-lv-4);
										strong {
											font-weight: 500;
											color: hsl(var(--hue-saturation-blue), 30%);
										}
									}
									#data_dashboard_progress_percent {
										font-weight: 500;
										color: hsl(var(--hue-saturation-blue), 30%);
									}
								}
								#data_dashboard_progress_bar {
									-webkit-appearance: none;
									appearance: none;
									width: 100%;
									height: 8px;
									border-radius: var(--bdrs-lv-3);
									overflow: hidden;
									&::-webkit-progress-bar {
										background: hsl(var(--hue-saturation-blue), 90%);
									}
									&::-webkit-progress-value {
										background: hsl(var(--hue-saturation-blue), 30%);
										border-radius: var(--bdrs-lv-3);
									}
								}
							}
							.data_dashboard_filter {
								display: flex;
								align-items: center;
								gap: 12px;
								#search_vocabulary {
									width: 100%;
									height: 30px;
									padding: 0 6px;
									font-family: "Consolas", "Courier New", monospace;
									font-size: var(--fz-lv-4);
									color: var(--color-lv-2);
									background: var(--bg-box);
									border: 1px solid var(--bd-box);
									border-radius: var(--bdrs-lv-3);
									&::placeholder {
										color: var(--color-placeholder);
									}
									&:focus {
										border-color: var(--color-placeholder);
									}
								}
								.option {
									flex-shrink: 0;
									display: flex;
									gap: 6px;
									label {
										display: flex;
										align-items: center;
										height: 30px;
										padding: 0 6px;
										color: hsl(var(--hue-saturation-gray), 40%);
										background: hsl(var(--hue-saturation-gray), 95%);
										border: 1px solid hsl(var(--hue-saturation-gray), 90%);
										border-radius: var(--bdrs-lv-3);
										cursor: pointer;
										&:hover {
											background: hsl(var(--hue-saturation-gray), 90%);
											border-color: hsl(var(--hue-saturation-gray), 85%);
										}
										&:active {
											background: hsl(var(--hue-saturation-gray), 85%);
											border-color: hsl(var(--hue-saturation-gray), 80%);
										}
										input[type="radio"] {
											display: none;
										}
										&:has(input:checked) {
											color: hsl(var(--hue-saturation-blue), 95%);
											background: hsl(var(--hue-saturation-blue), 50%);
											border: 1px solid hsl(var(--hue-saturation-blue), 45%);
											&:hover {
												background: hsl(var(--hue-saturation-blue), 45%);
												border-color: hsl(var(--hue-saturation-blue), 40%);
											}
											&:active {
												background: hsl(var(--hue-saturation-blue), 40%);
												border-color: hsl(var(--hue-saturation-blue), 35%);
											}
										}
									}
								}
							}
						}
					}
					.app-main_container {
						padding: 12px;
						display: flex;
						flex-direction: column;
						gap: 12px;
						.data_lists {
							display: grid;
							grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
							grid-gap: 12px;
							.item {
								display: flex;
								flex-direction: column;
								justify-content: space-between;
								align-items: center;
								padding: 12px;
								color: var(--color-lv-2);
								background: var(--bg-box);
								border: 1px solid var(--bd-box);
								border-radius: var(--bdrs-lv-3);
								&:hover {
									border-color: hsl(var(--hue-saturation-gray), 80%);
								}
								&[data-label="HSK01"] {
									--hue-saturation: 40, 90%;
									--light: 60%;
								}
								&[data-label="HSK02"] {
									--hue-saturation: 35, 90%;
									--light: 60%;
								}
								&[data-label="HSK03"] {
									--hue-saturation: 30, 90%;
									--light: 60%;
								}
								&[data-label="HSK04"] {
									--hue-saturation: 185, 75%;
									--light: 40%;
								}
								&[data-label="HSK05"] {
									--hue-saturation: 180, 75%;
									--light: 40%;
								}
								&[data-label="HSK06"] {
									--hue-saturation: 175, 75%;
									--light: 40%;
								}
								&[data-label="HSK79"] {
									--hue-saturation: 260, 40%;
									--light: 50%;
								}
								.pinyin {
									font-family: "LXGW WenKai Mono TC", monospace;
								}
								.hanzi {
									font-family: "LXGW WenKai Mono TC", monospace;
									font-size: 40px;
									font-weight: 300;
									margin: 6px 0;
								}
								.bottom {
									margin-top: 12px;
									display: flex;
									justify-content: space-between;
									align-items: center;
									width: 100%;
									.label {
										line-height: 24px;
										padding: 0 6px;
										font-size: 10px;
										font-weight: 500;
										color: rgba(255, 255, 255, 0.8);
										background: hsl(var(--hue-saturation), var(--light));
										border: 1px solid hsl(var(--hue-saturation), calc(var(--light) - 5%));
										border-radius: var(--bdrs-lv-4);
									}
									.btn-gr {
										display: flex;
										gap: 6px;
										button {
											width: 26px;
											height: 26px;
											font-size: 20px;
											border-radius: var(--bdrs-lv-4);
											&.active {
												color: rgba(255, 255, 255, 0.8);
												background: hsl(var(--hue-saturation), var(--light));
												border: 1px solid hsl(var(--hue-saturation), calc(var(--light) - 5%));
											}
										}
									}
								}
								&.learned {
									border: 1px solid hsl(var(--hue-saturation), calc(var(--light) + 10%));
									box-shadow: 0 0 20px -10px hsl(var(--hue-saturation), var(--light)) inset;
								}
							}
							.null {
								display: block;
								text-align: center;
								color: hsl(var(--hue-saturation-gray), 50%);
							}
						}
					}
				}
			}
			#backToTop {
				position: fixed;
				bottom: 24px;
				right: 24px;
				display: none;
				width: 45px;
				height: 45px;
				background: hsl(210, 50%, 25%);
				color: hsl(39, 47%, 96%);
				border: none;
				border-radius: 50%;
				font-size: 20px;
				cursor: pointer;
				box-shadow: 0 4px 6px rgba(0,0,0,0.1);
				&:hover {
					background: hsl(210, 50%, 30%);
				}
			}
		</style>
	</head>
	<body>
		<div class="app" id="app">
			<header class="app-header">
				<div class="app-header_container">
					<a href="" class="app-header_container_logo">
						<img src="https://hiepdeep.github.io/library/pictures/svg/books.svg" alt="Xué Hànzì Logo" class="app-header_container_logo_img">
						<span class="app-header_container_logo_text">𝐗𝐮𝐞𝐇𝐚𝐧𝐳𝐢</span>
					</a>
				</div>
			</header>
			<main class="app-main">
				<div class="app-main_data_dashboard">
					<div class="app-main_container">
						<div class="data_dashboard_header">
							<div class="data_dashboard_header">
								<span class="data_dashboard_header_icon material-symbols-rounded">import_contacts</span>
								<span class="data_dashboard_header_label">Học <strong>HSK1</strong></span>
							</div>
							<button class="favorites-btn" btn-light-red>
								<span id="data_dashboard_header_favorites">0</span>
								<span class="data_dashboard_header_icon material-symbols-rounded">favorite</span>
							</button>
						</div>
						<div class="data_dashboard_progress">
							<div class="data_dashboard_progress_header">
								<span id="data_dashboard_progress_count"><strong>0/0</strong> từ đã học thuộc</span>
								<span id="data_dashboard_progress_percent">0%</span>
							</div>
							<progress id="data_dashboard_progress_bar" name="data_dashboard_progress_bar" value="0" max="0"></progress>
						</div>
						<div class="data_dashboard_filter">
							<input type="search" id="search_vocabulary" placeholder="Search..">
							<div class="option">
								<label for="filter-all">
									<input type="radio" id="filter-all" name="view-learn" value="all" checked>
									<span class="txt">Tất cả</span>
								</label>
								<label for="filter-unlearned">
									<input type="radio" id="filter-unlearned" name="view-learn" value="unlearned">
									<span class="txt">Chưa học</span>
								</label>
								<label for="filter-learned">
									<input type="radio" id="filter-learned" name="view-learn" value="learned">
									<span class="txt">Đã học</span>
								</label>
							</div>
						</div>
					</div>
				</div>
				<div class="app-main_container">
					<div class="data_lists" id="data_lists">
						<span class="null">Đang tải dữ liệu..</span>
					</div>
				</div>
			</main>
		</div>
		<button class="material-symbols-rounded" id="backToTop">vertical_align_top</button>
		<button class="material-symbols-rounded" id="backToTop">vertical_align_top</button>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
		<script type="text/javascript">
			console.clear();
			const app = firebase.initializeApp({
				databaseURL: "https://xue-hanzi-default-rtdb.asia-southeast1.firebasedatabase.app"
			});
			const db = firebase.database();
			// Khai báo tên thẻ
			const data_lists = document.getElementById("data_lists");
			const listFavorite = document.getElementById("data_dashboard_header_favorites");
			const progressCount = document.getElementById("data_dashboard_progress_count");
			const progressPercent = document.getElementById("data_dashboard_progress_percent");
			const progressBar = document.getElementById("data_dashboard_progress_bar");
			const searchInput = document.getElementById("search_vocabulary");
			const filterRadios = document.querySelectorAll("input[name='view-learn']");
			let totalWords = 0;
			let favoriteCount = 0;
			let learnedCount = 0;
			let currentFilter = "all";
			let currentSearchText = "";
			let hasAnimated = false;
			// Tải dữ liệu từ Realtime Database
			async function render_lists() {
				totalWords = 0;
				favoriteCount = 0;
				learnedCount = 0;
				data_lists.innerHTML = "";
				try {
					const snapshot = await db.ref("hsk-basic/hsk01").once("value");
					if (!snapshot.exists()) {
						data_lists.innerHTML = "<span class='null'>Không tìm thấy dữ liệu từ vựng nào!</span>";
						return;
					}
					const val = snapshot.val();
					Object.entries(val).forEach(([itemKey, item]) => {
						totalWords++;
						const isFavorite = String(item.status?.favorite) === "true";
						const isLearned = String(item.status?.learned) === "true";
						if (isFavorite) favoriteCount++;
						if (isLearned) learnedCount++;
						const div = document.createElement("div");
						div.classList.add("item");
						div.dataset.label = item.label[0];
						div.dataset.key = itemKey;
						if (isLearned) div.classList.add("learned");
						div.innerHTML = `
							<span class="pinyin">${item.pinyin || "N/A"}</span>
							<span class="hanzi">${item.simplified || "N/A"}</span>
							<div class="bottom">
								<span class="label">${item.label[1] || "N/A"}</span>
								<div class="btn-gr">
									<button btn-light-gray class="material-symbols-rounded view-btn" data-key="${itemKey}">language_pinyin</button>
									<button btn-light-gray class="material-symbols-rounded favorite-btn ${isFavorite ? 'active' : ''}" data-key="${itemKey}">${isFavorite ? "heart_minus" : "heart_plus"}</button>
									<button btn-light-gray class="material-symbols-rounded learn-btn ${isLearned ? 'active' : ''}" data-key="${itemKey}">done</button>
								</div>
							</div>
						`;
						data_lists.appendChild(div);
						// Nút View
						div.querySelector(`.view-btn[data-key="${itemKey}"]`).addEventListener("click", () => {
							window.open(`?page=${encodeURIComponent(item.simplified)}`, "_blank");
						});
						// Nút Thêm vào danh sách Yêu thích
						div.querySelector(`.favorite-btn[data-key="${itemKey}"]`).addEventListener("click", async (e) => {
							const btn = e.currentTarget;
							const favoriteRef = db.ref(`hsk-basic/hsk01/${itemKey}/status/favorite`);
							try {
								const snap = await favoriteRef.once("value");
								const isFav = String(snap.val()) === "true";
								const nextState = isFav ? "" : "true";
								await favoriteRef.set(nextState);
								btn.classList.toggle("active", !isFav);
								btn.textContent = !isFav ? "heart_minus" : "heart_plus";
								if (!isFav) {
									favoriteCount++;
								} else {
									favoriteCount = Math.max(0, favoriteCount - 1);
								}
								updateDashboard();
							} catch (error) {
								console.error("Lỗi khi cập nhật dữ liệu từ Firebase:", error);
							}
						});
						// Nút Đã học
						div.querySelector(`.learn-btn[data-key="${itemKey}"]`).addEventListener("click", async (e) => {
							const btn = e.currentTarget;
							const learnedRef = db.ref(`hsk-basic/hsk01/${itemKey}/status/learned`);
							try {
								const snap = await learnedRef.once("value");
								const isLearnedState = String(snap.val()) === "true";
								const nextState = isLearnedState ? "" : "true";
								await learnedRef.set(nextState);
								btn.classList.toggle("active", !isLearnedState);
								div.classList.toggle("learned", !isLearnedState);
								if (!isLearnedState) {
									learnedCount++;
								} else {
									learnedCount = Math.max(0, learnedCount - 1);
								}
								updateDashboard();
							} catch (error) {
								console.error("Lỗi khi cập nhật trạng thái đã học:", error);
							}
						});
					});
					updateDashboard();
				} catch (error) {
					console.error("Lỗi khi tải dữ liệu từ Firebase:", error);
					data_lists.innerHTML = "<span class='null'>Không thể tải dữ liệu từ vựng!</span>";
				}
			}
			document.addEventListener("DOMContentLoaded", render_lists);
			// Hiệu ứng đếm số
			function animateValue(element, start, end, duration, formatFn) {
				if (start === end) {
					element.innerHTML = formatFn ? formatFn(end) : end;
					return;
				}
				let startTimestamp = null;
				const step = (timestamp) => {
					if (!startTimestamp) startTimestamp = timestamp;
					const progress = Math.min((timestamp - startTimestamp) / duration, 1);
					const current = Math.floor(progress * (end - start) + start);
					element.innerHTML = formatFn ? formatFn(current) : current;
					if (progress < 1) {
						window.requestAnimationFrame(step);
					} else {
						element.innerHTML = formatFn ? formatFn(end) : end;
					}
				};
				window.requestAnimationFrame(step);
			}
			// Cập nhật Dashboard & Xử lý Tìm kiếm, Lọc
			function updateDashboard() {
				const targetPercent = totalWords > 0 ? Number(((learnedCount / totalWords) * 100).toFixed(1)) : 0;
				if (!hasAnimated) {
					animateValue(listFavorite, 0, favoriteCount, 1000);
					animateValue(progressCount, 0, learnedCount, 1000, (val) => {
						return `<strong>${val}/${totalWords}</strong> từ đã học thuộc`;
					});
					animateValue(progressPercent, 0, targetPercent, 1000, (val) => {
						return `${val}%`;
					});
					let startProgress = 0;
					const duration = 1000;
					let startTimestamp = null;
					const animateProgress = (timestamp) => {
						if (!startTimestamp) startTimestamp = timestamp;
						const progress = Math.min((timestamp - startTimestamp) / duration, 1);
						progressBar.value = progress * learnedCount;
						progressBar.max = totalWords;
						if (progress < 1) {
							window.requestAnimationFrame(animateProgress);
						} else {
							progressBar.value = learnedCount;
							progressBar.max = totalWords;
						}
					};
					window.requestAnimationFrame(animateProgress);
					hasAnimated = true;
				} else {
					listFavorite.textContent = favoriteCount;
					progressCount.innerHTML = `<strong>${learnedCount}/${totalWords}</strong> từ đã học thuộc`;
					progressPercent.textContent = `${targetPercent}%`;
					progressBar.value = learnedCount;
					progressBar.max = totalWords;
				}
				filterAndSearchList();
			}
			// Hàm thực thi lọc và tìm kiếm
			function filterAndSearchList() {
				const items = data_lists.querySelectorAll(".item");
				let visibleCount = 0;
				items.forEach((item) => {
					const pinyinText = (item.querySelector(".pinyin")?.textContent || "").toLowerCase();
					const hanziText = item.querySelector(".hanzi")?.textContent || "";
					const isLearned = item.classList.contains("learned");
					let matchesFilter = true;
					if (currentFilter === "learned") {
						matchesFilter = isLearned;
					} else if (currentFilter === "unlearned") {
						matchesFilter = !isLearned;
					}
					const matchesSearch = pinyinText.includes(currentSearchText) || hanziText.includes(currentSearchText);
					if (matchesFilter && matchesSearch) {
						item.style.display = "flex";
						visibleCount++;
					} else {
						item.style.display = "none";
					}
				});
				let nullMsg = data_lists.querySelector(".null-search");
				if (visibleCount === 0 && items.length > 0) {
					if (!nullMsg) {
						nullMsg = document.createElement("span");
						nullMsg.className = "null null-search";
						data_lists.appendChild(nullMsg);
					}
					nullMsg.textContent = "Không tìm thấy từ vựng phù hợp!";
					nullMsg.style.display = "block";
				} else if (nullMsg) {
					nullMsg.style.display = "none";
				}
			}
			// Search
			searchInput.addEventListener("input", (e) => {
				currentSearchText = e.target.value.trim().toLowerCase();
				filterAndSearchList();
			});
			// Filter
			filterRadios.forEach((radio) => {
				radio.addEventListener("change", (e) => {
					if (e.target.checked) {
						currentFilter = e.target.value;
						filterAndSearchList();
					}
				});
			});
			// Xử lý nút cuộn lên đầu trang
			const backToTopBtn = document.getElementById("backToTop");
			window.addEventListener("scroll", () => {
				if (window.scrollY > 300) {
					backToTopBtn.style.display = "block";
				} else {
					backToTopBtn.style.display = "none";
				}
			});
			function scrollToTop(duration) {
				const startPosition = window.scrollY;
				const startTime = performance.now();
				function step(currentTime) {
					const elapsed = currentTime - startTime;
					const progress = Math.min(elapsed / duration, 1);
					const easeOutCubic = 1 - Math.pow(1 - progress, 3);
					window.scrollTo(0, startPosition * (1 - easeOutCubic));
					if (progress < 1) {
						requestAnimationFrame(step);
					}
				}
				requestAnimationFrame(step);
			}
			backToTopBtn.addEventListener("click", () => {
				scrollToTop(2000);
			});
		</script>
	</body>
</html>
