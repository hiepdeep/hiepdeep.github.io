<!DOCTYPE html>
<html lang="vn">
	<head>
		<meta charset="UTF-8">
		<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
		<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
		<link rel="icon" href="favicon.png">
		<link rel="apple-touch-icon" href="icon.png">
		<title>学汉字 | Xué Hànzì</title>
		<link rel="stylesheet" href="https://hiepdeep.github.io/library/style/style.css">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="app-container">
			<header class="app-header" id="header-top">
				<a href="" class="logo">
					<img src="https://hiepdeep.github.io/library/pictures/svg/books.svg" alt="">
					<span class="text">Xué Hànzì</span>
				</a>
				<nav class="nav">
					<ul>
						<li><a href="javascript:;" class="focus">Từ vựng</a></li>
						<li><a href="javascript:;">Mẫu câu</a></li>
						<li><a href="javascript:;">Đoạn văn</a></li>
						<li><a href="javascript:;">Đoạn hội thoại</a></li>
					</ul>
				</nav>
			</header>
			<main class="app-main">
				<div class="vocab-dashboard">
					<div class="vocab-progress">
						<div class="vocab-progress__header">
							<span class="vocab-progress__label">Từ vựng đã học</span>
							<span class="vocab-progress__count">0/0</span>
						</div>
						<progress id="vocab-progress__bar" name="vocab-progress__bar" value="0" max="500"></progress>
					</div>
					<div class="filter-box">
						<input type="search" id="search-vocabulary" placeholder="Search..">
						<div class="option">
							<label for="filter-all">
								<input type="radio" id="filter-all" name="view-learn" value="all" checked>
								<span class="txt">Tất cả</span>
							</label>
							<label for="filter-unlearned">
								<input type="radio" id="filter-unlearned" name="view-learn" value="learn">
								<span class="txt">Chưa học</span>
							</label>
							<label for="filter-learned">
								<input type="radio" id="filter-learned" name="view-learn" value="learned">
								<span class="txt">Đã học</span>
							</label>
						</div>
					</div>
				</div>
				<div id="vocabulary-list">
					<span class="null">Không tìm thấy dữ liệu từ vựng nào!</span>
				</div>
			</main>
		</div>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
		<script src='https://hiepdeep.github.io/library/script/function/functions.js'></script>
		<script src="script.js"></script>
	</body>
</html>
