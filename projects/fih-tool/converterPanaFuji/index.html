<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
		<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
		<meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
		<title>Converter Pana to Fuji | V01</title>
		<link rel="stylesheet" href="https://hiepdeep.github.io/library/style/style.css">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="box">
			<div class="toolbar">
				<button class="btn-import active">Mark & Placement</button>
				<button id="btnGenerator">Converter</button>
			</div>
			<div class="main">
				<div class="data-import active">
					<div class="table" id="pasteMark">
						<table>
							<tr>
								<th></th>
								<th>X</th>
								<th>Y</th>
							</tr>
							<tr>
								<th>Mark 1</th>
								<td><input type="tel" id="mark-X1" placeholder="0" pattern="[0-9.]*" required></td>
								<td><input type="tel" id="mark-Y1" placeholder="0" pattern="[0-9.]*" required></td>
							</tr>
							<tr>
								<th>Mark 2</th>
								<td><input type="tel" id="mark-X2" placeholder="0" pattern="[0-9.]*" required></td>
								<td><input type="tel" id="mark-Y2" placeholder="0" pattern="[0-9.]*" required></td>
							</tr>
						</table>
					</div>
					<div class="label">
						<label class="label-importfile">
							<input type="file" id="newCSV" accept="text/csv" data-title="Drag and drop a file" hidden="hidden">
							<span class="txt">Mở file CSV</span>
						</label>
					</div>
					<textarea id="importCSV" placeholder="This is data Placement.."></textarea>
				</div>
				<div id="dataGenerator">
					<div class="table" id="tableResult"></div>
				</div>
			</div>
			<div class="footer">
				<div class="status-box">
					<span id="sumPlacement" class="val">0</span>
					<span>Placement</span>
				</div>
				<div class="status-box">
					<span id="sumPoint" class="val">0</span>
					<span>Point</span>
				</div>
				<span class="spacer"></span>
				<span class="copyright">Created, maintained and evolved by <b>HiepDeep</b>.</span>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
