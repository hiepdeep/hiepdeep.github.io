<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">

		<title>Get CAD AOi Holly V2026.8.29 | FUJI</title>
		<style type="text/css">
			html, body, div, a, b, i, label, span, strong, table, tbody, td, tfoot, th, thead, tr {
				outline: none;
				vertical-align: baseline;
			}
			:link, button {
				text-decoration: none;

				-webkit-user-select: none;
				-moz-user-select: none;

				user-select: none;
			}
			:link, :hover, :focus, :active, :visited {
				outline: none;
			}
			::-webkit-scrollbar {
				width: 0;
				height: 0;
			}
			:root {
				--hue-saturation-purple: 260deg, 50%;
				--hue-saturation-pink: 330deg, 60%;
				--hue-saturation-orange: 30deg, 80%;
				--hue-saturation-brown: 20deg, 40%;
				--hue-saturation-teal: 170deg, 50%;
				--hue-saturation-yellow: 50deg, 80%;
				--hue-saturation-red: 10deg, 70%;
				--hue-saturation-green: 140deg, 50%;
				--hue-saturation-blue: 210deg, 70%;
				--hue-saturation-gray: 200deg, 10%;
				--bg-body-blue: hsl(var(--hue-saturation-blue), 95%);
				--bg-body-gray: hsl(var(--hue-saturation-gray), 95%);
				--bg-box: hsl(var(--hue-saturation-gray), 100%);
				--bd-box: hsl(var(--hue-saturation-gray), 90%);
				--color-lv-1: hsl(var(--hue-saturation-gray), 10%);
				--color-lv-2: hsl(var(--hue-saturation-gray), 20%);
				--color-lv-3: hsl(var(--hue-saturation-gray), 30%);
				--color-lv-4: hsl(var(--hue-saturation-gray), 40%);
				--color-white: hsl(var(--hue-saturation-gray), 95%);
				--color-placeholder: hsl(var(--hue-saturation-gray), 70%);
				--fz-lv-1: 18px;
				--fz-lv-2: 16px;
				--fz-lv-3: 14px;
				--fz-lv-4: 12px;
				--bdrs-lv-1: 16px;
				--bdrs-lv-2: 12px;
				--bdrs-lv-3: 8px;
				--bdrs-lv-4: 4px;
				--bdrs-lv-5: 2px;
			}
			* {
				margin: 0;
				padding: 0;
				-webkit-box-sizing: border-box;
				box-sizing: border-box;
				letter-spacing: 0.05em;
				-webkit-tap-highlight-color: transparent;
				-webkit-font-smoothing: antialiased;
				font-family: "Courier New", sans-serif;
				color: red;
				font-size: var(--fz-lv-4);
			}
			body {
				background: var(--bg-body-blue);
				display: -ms-grid;
				display: grid;
				place-items: center;
				height: 100vh;
			}
			.box {
				width: 100%;
				height: 100vh;
				margin: 0 auto;
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-orient: vertical;
				-webkit-box-direction: normal;
				-ms-flex-direction: column;
				flex-direction: column;
				gap: 12px;
				padding: 12px;
				-webkit-user-select: none;
				-moz-user-select: none;
				-ms-user-select: none;
				user-select: none;
			}
			.box .my-header {
				-ms-flex-negative: 0;
				flex-shrink: 0;
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-pack: justify;
				-ms-flex-pack: justify;
				justify-content: space-between;
				-webkit-box-align: center;
				-ms-flex-align: center;
				align-items: center;
				padding: 12px;
				background: var(--bg-box);
				border: 1px solid var(--bd-box);
				border-radius: var(--bdrs-lv-4);
			}
			.box .my-header a {
				font-weight: bold;
				font-size: var(--fz-lv-3);
				color: var(--color-lv-1);
			}
			.box .my-header .navigation-bar {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-align: center;
				-ms-flex-align: center;
				align-items: center;
				gap: 12px;
			}
			.box .my-header .navigation-bar .btnImport {
				all: unset;
				cursor: pointer;
				color: var(--color-lv-3);
			}
			.box .my-header .navigation-bar .btnImport b {
				font-weight: bold;
				color: inherit;
			}
			.box .my-header .navigation-bar .btnImport.active {
				text-decoration: underline;
			}
			.box .my-header .navigation-bar #btnExport {
				padding: 6px;
				font-weight: bold;
				color: hsl(var(--hue-saturation-blue), 95%);
				background: hsl(var(--hue-saturation-blue), 50%);
				border: 1px solid hsl(var(--hue-saturation-blue), 45%);
				border-radius: var(--bdrs-lv-5);
			}
			.box .my-header .navigation-bar #btnExport:hover {
				background: hsl(var(--hue-saturation-blue), 45%);
				border-color: hsl(var(--hue-saturation-blue), 40%);
			}
			.box .my-header .navigation-bar #btnExport:active {
				background: hsl(var(--hue-saturation-blue), 40%);
				border-color: hsl(var(--hue-saturation-blue), 35%);
			}
			.box .my-header .navigation-bar #btnExport.active {
				background: hsl(var(--hue-saturation-green), 40%);
				border-color: hsl(var(--hue-saturation-green), 35%);
			}
			.box .my-header .navigation-bar .split {
				color: var(--color-placeholder);
			}
			.box .main {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-orient: vertical;
				-webkit-box-direction: normal;
				-ms-flex-direction: column;
				flex-direction: column;
				height: 100%;
				overflow: hidden;
			}
			.box .main .txtImport {
				display: none;
				height: 100%;
			}
			.box .main .txtImport label[for=addPartReportUnit] .txt {
				display: block;
				padding: 6px;
				text-align: center;
				cursor: pointer;
				color: hsl(var(--hue-saturation-gray), 95%);
				background: hsl(var(--hue-saturation-gray), 50%);
				border: 1px solid hsl(var(--hue-saturation-gray), 45%);
				border-radius: var(--bdrs-lv-4);
			}
			.box .main .txtImport label[for=addPartReportUnit] .txt:hover {
				background: hsl(var(--hue-saturation-gray), 45%);
				border-color: hsl(var(--hue-saturation-gray), 40%);
			}
			.box .main .txtImport label[for=addPartReportUnit] .txt:active {
				background: hsl(var(--hue-saturation-gray), 40%);
				border-color: hsl(var(--hue-saturation-gray), 35%);
			}
			.box .main .txtImport textarea {
				width: 100%;
				height: 100%;
				padding: 12px;
				font-family: "consolas";
				color: var(--color-lv-3);
				background: var(--bg-box);
				border: 1px solid var(--bd-box);
				border-radius: var(--bdrs-lv-4);
				resize: none;
				overflow-y: scroll;
			}
			.box .main .txtImport.active {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-orient: vertical;
				-webkit-box-direction: normal;
				-ms-flex-direction: column;
				flex-direction: column;
				gap: 6px;
			}
			.box .main .txtExport {
				display: none;
				height: 100%;
				padding: 6px;
				background: var(--bg-box);
				border: 1px solid var(--bd-box);
				border-radius: var(--bdrs-lv-4);
				overflow-y: scroll;
			}
			.box .main .txtExport table {
				border-collapse: collapse;
				width: 100%;
				-webkit-user-select: all;
				-moz-user-select: all;
				user-select: all;
			}
			.box .main .txtExport table tr th, .box .main .txtExport table tr td {
				text-align: left;
				padding: 6px;
				color: var(--color-lv-3);
			}
			.box .main .txtExport table tr th {
				font-weight: bold;
				border-bottom: 1px solid var(--bd-box);
			}
			.box .main .txtExport.active {
				display: block;
			}
			.box .my-footer {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-pack: justify;
				-ms-flex-pack: justify;
				justify-content: space-between;
				-webkit-box-align: center;
				-ms-flex-align: center;
				align-items: center;
				gap: 12px;
			}
			.box .my-footer .totals span {
				color: var(--color-lv-4);
			}
			.box .my-footer .totals span strong {
				font-weight: bold;
				color: inherit;
			}
			.box .my-footer .copyright {
				color: var(--color-lv-4);
			}
			.box .my-footer .copyright b {
				font-weight: bold;
				color: inherit;
			}
		</style>
	</head>
	<body>
		<div class="box">
			<div class="my-header">
				<a href="">Generator CAD AOi Holly - Fuji</a>
				<div class="navigation-bar">
					<button class="btnImport active"><b>Mark</b></button>
					<span class="split">&gt;</span>
					<button class="btnImport"><b>PartReportUnit</b></button>
					<span class="split">&gt;</span>
					<button class="btnImport"><b>Place</b></button>
					<span class="split">&gt;</span>
					<button class="btnImport"><b>Insert Order</b> (Tuỳ chọn)</button>
					<span class="split">&gt;</span>
					<button id="btnExport">Generator</button>
				</div>
			</div>
			<div class="main">
				<div class="txtImport active">
					<textarea id="importMark" placeholder="Pls add Mark.."></textarea>
				</div>
				<div class="txtImport">
					<label class="addPartReportUnit" for="addPartReportUnit">
						<input type="file" id="addPartReportUnit" accept="text/xml" data-title="Drag and drop a file" hidden="hidden" multiple>
						<span class="txt">Chọn file PartReportUnit đã lưu</span>
					</label>
					<textarea id="importPartReportUnit" placeholder="Pls add PartReportUnit.."></textarea>
				</div>
				<div class="txtImport">
					<textarea id="importPlace" placeholder="Pls add Place.."></textarea>
				</div>
				<div class="txtImport">
					<textarea id="importInsertOrder" placeholder="Pls add InsertOrder.."></textarea>
				</div>
				<div class="txtExport" id="txtExport"></div>
			</div>
			<div class="my-footer">
				<div class="totals">
					<span><strong id="total-place">0</strong></span>
					<span><strong id="total-cad">0</strong></span>
				</div>
				<span class="copyright">Created, copyright, maintained and evolved by <b>HiepDeep</b>.</span>
			</div>
		</div>
		<script type="text/javascript">
			console.clear();
			var btnImports = document.getElementsByClassName("btnImport");
			var txtImports = document.getElementsByClassName("txtImport");
			var btnExport = document.getElementById("btnExport");
			var txtExport = document.getElementById("txtExport");
			for (var i = 0; i < btnImports.length; i++) {
				(function(index) {
					btnImports[index].addEventListener("click", function(e) {
						e.preventDefault();
						for (var j = 0; j < btnImports.length; j++) {
							btnImports[j].classList.remove("active");
							txtImports[j].classList.remove("active");
						}
						btnExport.classList.remove("active");
						txtExport.classList.remove("active");
						btnImports[index].classList.add("active");
						txtImports[index].classList.add("active");
					});
				})(i);
			}
			document.getElementById("importMark").addEventListener("input", function(e) {
				formatInput_1("importMark");
			});
			document.getElementById("addPartReportUnit").addEventListener("change", function() {
				var files = this.files;
				if (!files || files.length === 0) return;
				var allDataRows = [];
				var globalCounter = 1;
				function readIndividualFile(index) {
					if (index >= files.length) {
						formatInput_2("importPartReportUnit", allDataRows);
						return;
					}
					var reader = new FileReader();
					reader.onload = function(e) {
						var result = e.target.result.replace(/(\<\?)(.+)(\?\>)/gi, "").trim();
						var tempDiv = document.createElement("div");
						tempDiv.innerHTML = result;
						var xml_partreportunit = tempDiv.getElementsByTagName("partreportunit");
						var xml_unit = xml_partreportunit.length > 0 ? xml_partreportunit[0].getElementsByTagName("unit") : [];
						for (var i = 0; i < xml_unit.length; i++) {
							if (index > 0 && i === 0) continue;
							var rowData = [];
							var children = xml_unit[i].children;
							for (var j = 0; j < children.length; j++) {
								var cellText = (children[j].innerText || children[j].textContent || "").trim();
								if (j === 0 && cellText !== "seqInsOrder") {
									rowData.push(globalCounter.toString());
								} else {
									rowData.push(cellText);
								}
							}
							if (rowData[0] !== "seqInsOrder") {
								globalCounter++;
							}
							allDataRows.push(rowData);
						}
						readIndividualFile(index + 1);
					};
					reader.readAsText(files[index]);
				}
				readIndividualFile(0);
			});
			document.getElementById("importPlace").addEventListener("input", function(e) {
				formatInput_1("importPlace");
				var val = e.target.value || "";
				document.getElementById("total-place").innerText = val.trim().split("\n").length - 1;
			});
			document.getElementById("importInsertOrder").addEventListener("input", function(e) {
				formatInput_1("importInsertOrder");
			});
			btnExport.addEventListener("click", function(e) {
				e.preventDefault();
				for (var j = 0; j < btnImports.length; j++) {
					btnImports[j].classList.remove("active");
					txtImports[j].classList.remove("active");
				}
				btnExport.classList.add("active");
				txtExport.classList.add("active");
				// Mark
				var data_Mark = document.getElementById("importMark").value.trim();
				var row_Mark = [];
				var tempMarkRows = data_Mark.split("\n");
				for (var x = 0; x < tempMarkRows.length; x++) {
					row_Mark.push([]);
					var cells = tempMarkRows[x].split("|");
					for (var xx = 0; xx < cells.length; xx++) {
						row_Mark[x].push(cells[xx].trim());
					}
				}
				var mark_Block = row_Mark[0].indexOf("Board");
				var mark_LocationName = row_Mark[0].indexOf("Ref.");
				var mark_X = row_Mark[0].indexOf("Pos X");
				var mark_Y = row_Mark[0].indexOf("Pos Y");
				var arr_Mark = [
					["Block", "Location Name", "X", "Y"]
				];
				for (var row = 1; row < row_Mark.length; row++) {
					arr_Mark.push([]);
					var newRowIndex = arr_Mark.length - 1;
					arr_Mark[newRowIndex].push(row_Mark[row][mark_Block].trim());
					arr_Mark[newRowIndex].push(row_Mark[row][mark_LocationName].trim());
					arr_Mark[newRowIndex].push(row_Mark[row][mark_X].trim());
					arr_Mark[newRowIndex].push(row_Mark[row][mark_Y].trim());
				}
				// PartReportUnit
				var data_PartReportUnit = document.getElementById("importPartReportUnit").value.trim();
				var row_PartReportUnit = [];
				var tempPartReportUnitRows = data_PartReportUnit.split("\n");
				for (var x = 0; x < tempPartReportUnitRows.length; x++) {
					row_PartReportUnit.push([]);
					var cells = tempPartReportUnitRows[x].split("|");
					for (var xx = 0; xx < cells.length; xx++) {
						row_PartReportUnit[x].push(cells[xx].trim());
					}
				}
				var unit_seqBrdNum = row_PartReportUnit[0].indexOf("seqBrdNum");
				var unit_seqRef = row_PartReportUnit[0].indexOf("seqRef");
				var unit_seqPartNum = row_PartReportUnit[0].indexOf("seqPartNum");
				var unit_fsSetPos = row_PartReportUnit[0].indexOf("fsSetPos");
				var arr_PartReportUnit = [
					["Board", "Ref.", "Part Number", "Mounter", "Feeder", "BoardRef"]
				];
				for (var row = 1; row < row_PartReportUnit.length; row++) {
					arr_PartReportUnit.push([]);
					var newRowIndex = arr_PartReportUnit.length - 1;
					var brdNum = row_PartReportUnit[row][unit_seqBrdNum].trim();
					var ref = row_PartReportUnit[row][unit_seqRef].trim();
					arr_PartReportUnit[newRowIndex].push(brdNum);
					arr_PartReportUnit[newRowIndex].push(ref);
					arr_PartReportUnit[newRowIndex].push(row_PartReportUnit[row][unit_seqPartNum].trim());
					arr_PartReportUnit[newRowIndex].push(convertFsSetPos(row_PartReportUnit[row][unit_fsSetPos].trim(), "M"));
					arr_PartReportUnit[newRowIndex].push(convertFsSetPos(row_PartReportUnit[row][unit_fsSetPos].trim(), "F"));
					arr_PartReportUnit[newRowIndex].push(brdNum + ref);
				}
				// Place
				var data_Place = document.getElementById("importPlace").value.trim();
				var row_Place = [];
				var tempPlaceRows = data_Place.split("\n");
				for (var x = 0; x < tempPlaceRows.length; x++) {
					row_Place.push([]);
					var cells = tempPlaceRows[x].split("|");
					for (var xx = 0; xx < cells.length; xx++) {
						row_Place[x].push(cells[xx].trim());
					}
				}
				var place_Board = row_Place[0].indexOf("Board");
				var place_Ref = row_Place[0].indexOf("Ref.");
				var place_PosX = row_Place[0].indexOf("Pos X");
				var place_PosY = row_Place[0].indexOf("Pos Y");
				var place_Rotation = row_Place[0].indexOf("Rotation");
				var place_PartNumber = row_Place[0].indexOf("Part Number");
				var place_Assign = row_Place[0].indexOf("Assign");
				var arr_Place = [["Board", "Ref.", "Pos X", "Pos Y", "Rotation", "Part Number", "BoardRef", "Assign"]];
				for (var row = 1; row < row_Place.length; row++) {
					arr_Place.push([]);
					var newRowIndex = arr_Place.length - 1;
					var brdNum = row_Place[row][place_Board].trim();
					var ref = row_Place[row][place_Ref].trim();
					arr_Place[newRowIndex].push(brdNum);
					arr_Place[newRowIndex].push(ref);
					arr_Place[newRowIndex].push(row_Place[row][place_PosX].trim());
					arr_Place[newRowIndex].push(row_Place[row][place_PosY].trim());
					arr_Place[newRowIndex].push(row_Place[row][place_Rotation].trim());
					arr_Place[newRowIndex].push(row_Place[row][place_PartNumber].trim());
					arr_Place[newRowIndex].push(brdNum + ref);
					arr_Place[newRowIndex].push(row_Place[row][place_Assign].trim());
				}
				// InsertOrder
				var data_InsertOrder = document.getElementById("importInsertOrder").value.trim();
				var hasInsertOrderData = data_InsertOrder.length > 0;
				var arr_InsertOrder = [
					["Reference", "Holder"]
				];
				if (hasInsertOrderData) {
					var row_InsertOrder = [];
					var tempInsertOrderRows = data_InsertOrder.split("\n");
					for (var x = 0; x < tempInsertOrderRows.length; x++) {
						row_InsertOrder.push([]);
						var cells = tempInsertOrderRows[x].split("|");
						for (var xx = 0; xx < cells.length; xx++) {
							row_InsertOrder[x].push(cells[xx].trim());
						}
					}
					var order_Reference = null;
					var order_Holder = null;
					if (row_InsertOrder.length > 0 && row_InsertOrder[0].length > 0) {
						order_Reference = row_InsertOrder[0].indexOf("Reference");
						order_Holder = row_InsertOrder[0].indexOf("Holder Number");
					} else {
						order_Reference = -1;
						order_Holder = -1;
					}
					for (var row = 1; row < row_InsertOrder.length; row++) {
						if (row_InsertOrder[row].length > order_Reference && row_InsertOrder[row].length > order_Holder && order_Reference !== -1 && order_Holder !== -1) {
							arr_InsertOrder.push([]);
							var newRowIndex = arr_InsertOrder.length - 1;
							arr_InsertOrder[newRowIndex].push(row_InsertOrder[row][order_Reference].trim());
							arr_InsertOrder[newRowIndex].push(row_InsertOrder[row][order_Holder].trim());
						}
					}
				}
				// Generator CAD
				var table = document.createElement("table");
				var headerRow = table.insertRow();
				var headers = ["Block", "Location Name", "X", "Y", "Angle", "Part Number", "Mouter", "Feeder"];
				if (hasInsertOrderData) {
					headers.push("Holder");
				}
				for (var h = 0; h < headers.length; h++) {
					var th = document.createElement("th");
					th.textContent = headers[h];
					headerRow.appendChild(th);
				}
				for (var tr_Mark = 1; tr_Mark < arr_Mark.length; tr_Mark++) {
					if (arr_Mark[tr_Mark][0] == "0") {
						var locationName = arr_Mark[tr_Mark][1];
						var lastChar = locationName.charAt(locationName.length - 1);
						var row = table.insertRow();
						row.insertCell().textContent = arr_Mark[tr_Mark][0];
						row.insertCell().textContent = arr_Mark[tr_Mark][1];
						row.insertCell().textContent = arr_Mark[tr_Mark][2];
						row.insertCell().textContent = arr_Mark[tr_Mark][3];
						row.insertCell().textContent = "0";
						row.insertCell().textContent = "Mark";
						row.insertCell().textContent = "0";
						row.insertCell().textContent = "0";
						if (hasInsertOrderData) {
							row.insertCell().textContent = "0";
						}
					}
				}
				var ref_PartUnit = arr_PartReportUnit[0].indexOf("BoardRef");
				var sumCad = 0;
				for (var tr_PartUnit = 1; tr_PartUnit < arr_PartReportUnit.length; tr_PartUnit++) {
					var boardRefKey = arr_PartReportUnit[tr_PartUnit][ref_PartUnit];
					var board = vlookup(boardRefKey, arr_Place, 0);
					var ref = vlookup(boardRefKey, arr_Place, 1);
					var posX = vlookup(boardRefKey, arr_Place, 2);
					var posY = vlookup(boardRefKey, arr_Place, 3);
					var rotation = vlookup(boardRefKey, arr_Place, 4);
					var partNumber = vlookup(boardRefKey, arr_Place, 5);
					var assign = vlookup(boardRefKey, arr_Place, 7);
					var mounter = arr_PartReportUnit[tr_PartUnit][3];
					var feeder = arr_PartReportUnit[tr_PartUnit][4];
					if (board && ref) {
						sumCad++;
						var row = table.insertRow();
						row.insertCell().textContent = board.trim();
						row.insertCell().textContent = ref.trim();
						row.insertCell().textContent = posX.trim();
						row.insertCell().textContent = posY.trim();
						row.insertCell().textContent = rotation.trim();
						row.insertCell().textContent = partNumber.trim();
						row.insertCell().textContent = assign.trim() + "-" + mounter.trim();
						row.insertCell().textContent = feeder.trim();
						if (hasInsertOrderData) {
							var searchOrder = board.trim() + ":" + ref.trim();
							var holderValue = getHolder(searchOrder, arr_InsertOrder);
							var holderCell = holderValue ? "H" + holderValue.trim() : "";
							row.insertCell().textContent = holderCell;
						}
					}
				}
				document.getElementById("txtExport").innerHTML = "";
				document.getElementById("txtExport").appendChild(table);
				document.getElementById("total-cad").innerText = sumCad;
			});
			function formatInput_1(elementId) {
				var arr0 = [];
				var arr1 = [];
				var arr2 = [];
				var arr3 = [];
				var inputElement = document.getElementById(elementId);
				var txtInput = inputElement.value.trim().split("\n");
				for (var x = 0; x < txtInput.length; x++) {
					arr0.push([]);
					var cells = txtInput[x].split("\t");
					for (var xx = 0; xx < cells.length; xx++) {
						arr0[x].push(cells[xx].trim());
					}
				}
				if (arr0.length > 0 && arr0[0].length > 0) {
					for (var x = 0; x < arr0[0].length; x++) {
						arr1.push([]);
						arr2.push([]);
						arr3.push([]);
						for (var xx = 0; xx < arr0.length; xx++) {
							var cellValue = arr0[xx][x] || "";
							arr1[x].push(cellValue);
							arr2[x].push(cellValue.length);
						}
						arr3[x].push(Math.max.apply(null, arr2[x]));
						for (var u = 0; u < arr1[x].length; u++) {
							var uLength = arr1[x][u].length;
							var maxLength = arr3[x][0];
							if (uLength < maxLength) {
								for (var k = 0; k < (maxLength - uLength); k++) {
									arr1[x][u] += " ";
								}
							}
						}
					}
					var ee = "";
					for (var x = 0; x < arr1[0].length; x++) {
						for (var xx = 0; xx < arr1.length; xx++) {
							ee += arr1[xx][x];
							if (xx < arr1.length - 1) {
								ee += " | ";
							}
						}
						if (x < arr1[0].length - 1) {
							ee += "\n";
						}
					}
					inputElement.value = ee.trim();
				}
			}

			function convertFsSetPos(fsSetPos, type) {
				if (!fsSetPos) return;
				var x = fsSetPos.split(/[\s-]+/);
				if (x.length === 2) {
					if (type == "M") {
						return "M" + x[0];
					}
					else if (type == "F") {
						return "F" + x[1];
					}
				}
				else if (x.length >= 3) {
					if (type == "M") {
						return "M" + x[0];
					}
					else if (type == "F") {
						return x[1] + x[2];
					}
				}
				return;
			}
			function vlookup(key, range, col) {
				for (var i = 0; i < range.length; i++) {
					if (range[i].length > 6 && range[i][6] == key) {
						return range[i][col];
					}
				}
				return "";
			}
			function getHolder(searchOrderKey, arr) {
				for (var i = 1; i < arr.length; i++) {
					if (arr[i].length >= 2) {
						var reference = arr[i][0];
						var holder = arr[i][1];
						if (reference === searchOrderKey) {
							return holder;
						}
					}
				}
				return "";
			}
