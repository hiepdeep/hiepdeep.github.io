<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
		<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
		<meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
		<title>Generator Placements Director | V02</title>
		<link rel="stylesheet" href="https://hiepdeep.github.io/library/style/style.css">
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<div class="box">
			<div class="toolbar">
				<button class="btn-import active">Import BOMs</button>
				<button class="btn-import">Import CADs</button>
				<button id="btnGenerator">Generator</button>
			</div>
			<div class="main">
				<div class="data-import active">
					<div class="label">
						<label class="label-importfile">
							<input type="file" id="newBoms" accept="text/*" data-title="Drag and drop a file" hidden="hidden">
							<span class="txt">Mở file BOMs</span>
						</label>
					</div>
					<textarea id="importBOMs" placeholder="This is BOMs.."></textarea>
					<textarea id="sameBOMs" placeholder="This is the same Part Number.."></textarea>
				</div>
				<div class="data-import">
					<div class="label">
						<label class="label-checkbox">
							<input type="checkbox" id="telitFormat">
							<span class="txt">Telit Format</span>
						</label>
						<label class="label-importfile">
							<input type="file" id="newCads" accept="text/*" data-title="Drag and drop a file" hidden="hidden">
							<span class="txt">Mở file CADs</span>
						</label>
					</div>
					<textarea id="importCADs" placeholder="This is CADs.."></textarea>
				</div>
				<div id="dataGenerator">
					<div class="row-data data-basic">
						<div class="table" id="tableBasic"></div>
						<div class="control-customize">
							<div class="customize">
								<div class="col col-1">
									<button id="btnTurn90" title="Xoay cả bản mạch +90°">Rotation +90°</button>
									<input type="text" id="nameSide" placeholder="Side">
									<div class="get-mark">
										<input type="text" id="markX1" placeholder="X1">
										<input type="text" id="markY1" placeholder="Y1">
										<button id="getMark1" title="Lấy toạ độ điểm Mark 1">Get FD1</button>
									</div>
									<div class="get-mark">
										<input type="text" id="markX2" placeholder="X2">
										<input type="text" id="markY2" placeholder="Y2">
										<button id="getMark2" title="Lấy toạ độ điểm Mark 2">Get FD2</button>
									</div>
								</div>
								<div class="col col-2">
									<div class="btn-action">
										<label class="label-checkbox">
											<input type="checkbox" id="selectMode">
											<span class="txt">Select Mode</span>
										</label>
										<button id="clearSelect" title="Bỏ chọn tất cả">Clear select</button>
										<button id="setBlock" title="Tạo Block cho vùng đang chọn">Set Block</button>
										<button id="clearBlock" title="Xoá Block cho vùng đang chọn">Clear Block</button>
									</div>
									<div class="myCanvas">
										<canvas id="myCanvas"></canvas>
									</div>
								</div>
							</div>
							<button id="btnExport">Export</button>
						</div>
					</div>
					<div class="row-data data-result">
						<div class="table" id="tableResult"></div>
					</div>
				</div>
			</div>
			<div class="footer">
				<div class="status-box">
					<span id="sumParts" class="val">0</span>
					<span>Part Number</span>
				</div>
				<div class="status-box" id="boxArea">
					<span id="sumCads" class="val">0</span>
					<span>Ref:</span>
					<span>[</span>
					<span id="onCad" class="val">0</span>
					<span>includes, </span>
					<span id="unCad" class="val">0</span>
					<span>missing</span>
					<span>]</span>
				</div>
				<span class="spacer"></span>
				<span class="copyright">Created, maintained and evolved by <b>HiepDeep</b>.</span>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
