<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
		<meta content="width=device-width, initial-scale=1" name="viewport">
		<meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
		<title>Get CAD AOi Holly V1.3 | PANA</title>
		<style type="text/css">
			html, body, div, a, b, i, label, span, strong, table, tbody, td, tfoot, th, thead, tr {
				outline: none;
				vertical-align: baseline;
			}
			:link, button {
				text-decoration: none;
				cursor: pointer;
				user-select: none;
			}
			:link, :hover, :focus, :active, :visited {
				outline: none;
			}
			::-webkit-scrollbar {
				width: 0;
				height: 0;
			}
			:root {
				--sans-serif: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
				--monospace: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
				--hue-saturation-purple: 260deg, 50%;
				--hue-saturation-pink: 330deg, 60%;
				--hue-saturation-orange: 30deg, 80%;
				--hue-saturation-brown: 20deg, 40%;
				--hue-saturation-teal: 170deg, 50%;
				--hue-saturation-yellow: 50deg, 80%;
				--hue-saturation-red: 10deg, 70%;
				--hue-saturation-green: 140deg, 50%;
				--hue-saturation-blue: 210deg, 70%;
				--hue-saturation-gray: 200deg, 10%;
				--bg-body-blue: hsl(var(--hue-saturation-blue), 95%);
				--bg-body-gray: hsl(var(--hue-saturation-gray), 95%);
				--bg-box: hsl(var(--hue-saturation-gray), 100%);
				--bd-box: hsl(var(--hue-saturation-gray), 90%);
				--color-lv-1: hsl(var(--hue-saturation-gray), 10%);
				--color-lv-2: hsl(var(--hue-saturation-gray), 20%);
				--color-lv-3: hsl(var(--hue-saturation-gray), 30%);
				--color-lv-4: hsl(var(--hue-saturation-gray), 40%);
				--color-white: hsl(var(--hue-saturation-gray), 95%);
				--color-placeholder: hsl(var(--hue-saturation-gray), 70%);
				--fz-lv-1: 18px;
				--fz-lv-2: 16px;
				--fz-lv-3: 14px;
				--fz-lv-4: 12px;
				--bdrs-lv-1: 16px;
				--bdrs-lv-2: 12px;
				--bdrs-lv-3: 8px;
				--bdrs-lv-4: 4px;
				--bdrs-lv-5: 2px;
			}
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				letter-spacing: 0.05em;
				-webkit-tap-highlight-color: transparent;
				-webkit-font-smoothing: antialiased;
			}
			iframe {
				width: 100%;
			}
			img {
				width: 100%;
				height: 100%;
				display: block;
				object-fit: cover;
			}
			ol, ul, li {
				list-style-type: none;
			}
			* {
				font-family: "Courier New";
				color: red;
				font-size: var(--fz-lv-4);
			}
			body {
				background: var(--bg-body-blue);
				display: grid;
				place-items: center;
				height: 100vh;
			}
			.box {
				width: 100%;
				height: 100vh;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 12px;
				user-select: none;
				.my-header {
					flex-shrink: 0;
					display: flex;
					justify-content: space-between;
					align-items: center;
					padding: 12px;
					background: var(--bg-box);
					border: 1px solid var(--bd-box);
					border-radius: var(--bdrs-lv-4);
					a {
						font-weight: bold;
						font-size: var(--fz-lv-3);
						color: var(--color-lv-1);
					}
					.navigation-bar {
						display: flex;
						align-items: center;
						gap: 12px;
						.btnImport {
							all: unset;
							cursor: pointer;
							color: var(--color-lv-3);
							b {
								font-weight: bold;
								color: inherit;
							}
							&.active {
								text-decoration: underline;
							}
						}
						#btnExport {
							padding: 6px;
							color: hsl(var(--hue-saturation-blue), 95%);
							background: hsl(var(--hue-saturation-blue), 50%);
							border: 1px solid hsl(var(--hue-saturation-blue), 45%);
							border-radius: var(--bdrs-lv-5);
							&:hover {
								background: hsl(var(--hue-saturation-blue), 45%);
								border-color: hsl(var(--hue-saturation-blue), 40%);
							}
							&:active {
								background: hsl(var(--hue-saturation-blue), 40%);
								border-color: hsl(var(--hue-saturation-blue), 35%);
							}
							&.active {
								background: hsl(var(--hue-saturation-green), 40%);
								border-color: hsl(var(--hue-saturation-green), 35%);
							}
						}
						.split {
							color: var(--color-placeholder);
						}
					}
				}
				.main {
					display: flex;
					flex-direction: column;
					height: 100%;
					overflow: hidden;
					.txtImport {
						display: none;
						height: 100%;
						.table {
							background: var(--bg-box);
							border: 1px solid var(--bd-box);
							border-radius: var(--bdrs-lv-4);
							overflow: hidden;
							height: 100%;
							table[id="importMark"] {
								border-collapse: collapse;
								width: 100%;
								user-select: all;
								tr {
									border-bottom: 1px solid var(--bd-box);
									th, td {
										text-align: left;
										color: var(--color-lv-3);
									}
									th {
										padding: 12px;
										font-weight: bold;
										user-select: none;
										&:nth-child(even) {
											border-left: 1px solid var(--bd-box);
											border-right: 1px solid var(--bd-box);
										}
									}
									td {
										&:nth-child(even) {
											border-left: 1px solid var(--bd-box);
											border-right: 1px solid var(--bd-box);
										}
										input {
											width: 100%;
											padding: 12px 12px;
											color: var(--color-lv-2);
											background: transparent;
											border: 0;
											&::placeholder {
												color: var(--color-placeholder);
											}
										}
									}
								}
							}
						}
						label[for="addCSV"] {
							.txt {
								display: block;
								padding: 6px;
								text-align: center;
								cursor: pointer;
								color: hsl(var(--hue-saturation-gray), 95%);
								background: hsl(var(--hue-saturation-gray), 50%);
								border: 1px solid hsl(var(--hue-saturation-gray), 45%);
								border-radius: var(--bdrs-lv-4);
								&:hover {
									background: hsl(var(--hue-saturation-gray), 45%);
									border-color: hsl(var(--hue-saturation-gray), 40%);
								}
								&:active {
									background: hsl(var(--hue-saturation-gray), 40%);
									border-color: hsl(var(--hue-saturation-gray), 35%);
								}
							}
						}
						textarea {
							width: 100%;
							height: 100%;
							padding: 12px;
							font-family: "consolas";
							color: var(--color-lv-3);
							background: var(--bg-box);
							border: 1px solid var(--bd-box);
							border-radius: var(--bdrs-lv-4);
							resize: none;
							overflow-y: scroll;
						}
						&.active {
							display: flex;
							flex-direction: column;
							gap: 6px;
						}
					}
					.txtExport {
						display: none;
						height: 100%;
						padding: 6px;
						background: var(--bg-box);
						border: 1px solid var(--bd-box);
						border-radius: var(--bdrs-lv-4);
						overflow-y: scroll;
						table {
							border-collapse: collapse;
							width: 100%;
							user-select: all;
							tr {
								th, td {
									text-align: left;
									padding: 6px;
									color: var(--color-lv-3);
								}
								th {
									font-weight: bold;
									border-bottom: 1px solid var(--bd-box);
								}
								td {
									
								}
							}
						}
						&.active {
							display: block;
						}
					}
				}
				.my-footer {
					display: flex;
					justify-content: space-between;
					align-items: center;
					gap: 12px;
					.totals {
						span {
							color: var(--color-lv-4);
							strong {
								font-weight: bold;
								color: inherit;
							}
						}
					}
					.copyright {
						color: var(--color-lv-4);
						b {
							font-weight: bold;
							color: inherit;
						}
					}
				}
			}
		</style>
	</head>
	<body>
		<div class="box">
			<div class="my-header">
				<a href="">Generator CAD AOi Holly - Panasonic</a>
				<div class="navigation-bar">
					<button class="btnImport active"><b>Mark</b></button>
					<span class="split">&gt;</span>
					<button class="btnImport">file <b>CSV</b></button>
					<span class="split">&gt;</span>
					<button id="btnExport">Generator</button>
				</div>
			</div>
			<div class="main">
				<div class="txtImport active">
					<div class="table">
						<table id="importMark">
							<tr>
								<th></th>
								<th>X</th>
								<th>Y</th>
							</tr>
							<tr>
								<th>Mark 1</th>
								<td><input type="tel" id="mark-X1" placeholder="0" pattern="[0-9.]*" required></td>
								<td><input type="tel" id="mark-Y1" placeholder="0" pattern="[0-9.]*" required></td>
							</tr>
							<tr>
								<th>Mark 2</th>
								<td><input type="tel" id="mark-X2" placeholder="0" pattern="[0-9.]*" required></td>
								<td><input type="tel" id="mark-Y2" placeholder="0" pattern="[0-9.]*" required></td>
							</tr>
						</table>
					</div>
				</div>
				<div class="txtImport">
					<label class="addCSV" for="addCSV">
						<input type="file" id="addCSV" accept="text/csv" data-title="Drag and drop a file" hidden="hidden">
						<span class="txt">Chọn file CSV đã lưu</span>
					</label>
					<textarea id="importCSV" placeholder="Pls add CSV.."></textarea>
				</div>
				<div class="txtExport" id="txtExport"></div>
			</div>
			<div class="my-footer">
				<div class="totals">
					<span><strong id="total-csv">0</strong></span>
					<span><strong id="total-cad">0</strong></span>
				</div>
				<span class="copyright">Created, maintained and evolved by <b>HiepDeep</b>.</span>
			</div>
		</div>
		<script type="text/javascript">
			console.clear();
			const btnImports = document.getElementsByClassName("btnImport");
			const txtImports = document.getElementsByClassName("txtImport");
			const btnExport = document.getElementById("btnExport");
			const txtExport = document.getElementById("txtExport");
			for (let i = 0; i < btnImports.length; i++) {
				btnImports[i].addEventListener("click", (e) => {
					e.preventDefault();
					for (let j = 0; j < btnImports.length; j++) {
						btnImports[j].classList.remove("active");
						txtImports[j].classList.remove("active");
					}
					btnExport.classList.remove("active");
					txtExport.classList.remove("active");
					btnImports[i].classList.add("active");
					txtImports[i].classList.add("active");
				});
			}
			document.getElementById("addCSV").addEventListener("change", function() {
				let file = this.files[0];
				if (!file) return;
				let reader = new FileReader();
				reader.onload = function(e) {
					let result = e.target.result.trim();
					let arr0 = [];
					let arr1 = [];
					let arr2 = [];
					let arr3 = [];
					let inputElement = document.getElementById("importCSV");
					let txtInput = result.split("\n");
					for (let x = 0; x < txtInput.length; x++) {
						arr0.push([]);
						let cells = txtInput[x].split(",");
						for (let xx = 0; xx < cells.length; xx++) {
							arr0[x].push(cells[xx].trim());
						}
					}
					if (arr0.length > 0 && arr0[0].length > 0) {
						for (let x = 0; x < arr0[0].length; x++) {
							arr1.push([]);
							arr2.push([]);
							arr3.push([]);
							for (let xx = 0; xx < arr0.length; xx++) {
								let cellValue = arr0[xx][x] || "";
								arr1[x].push(cellValue);
								arr2[x].push(cellValue.length);
							}
							arr3[x].push(Math.max.apply(null, arr2[x]));
							for (let u = 0; u < arr1[x].length; u++) {
								let uLength = arr1[x][u].length;
								let maxLength = arr3[x][0];
								if (uLength < maxLength) {
									for (let k = 0; k < (maxLength - uLength); k++) {
										arr1[x][u] += " ";
									}
								}
							}
						}
						let ee = "";
						for (let x = 0; x < arr1[0].length; x++) {
							for (let xx = 0; xx < arr1.length; xx++) {
								ee += arr1[xx][x];
								if (xx < arr1.length - 1) {
									ee += " | ";
								}
							}
							if (x < arr1[0].length - 1) {
								ee += "\n";
							}
						}
						inputElement.value = ee.trim();
						document.getElementById("total-csv").innerText = txtInput.length;
					}
				};
				reader.readAsText(file);
			});
			btnExport.addEventListener("click", (e) => {
				e.preventDefault();
				for (let j = 0; j < btnImports.length; j++) {
					btnImports[j].classList.remove("active");
					txtImports[j].classList.remove("active");
				}
				btnExport.classList.add("active");
				txtExport.classList.add("active");
				let data_CSV = document.getElementById("importCSV").value.trim();
				let row_CSV = [];
				let tempCSVRows = data_CSV.split("\n");
				for (let x = 0; x < tempCSVRows.length; x++) {
					row_CSV.push([]);
					let cells = tempCSVRows[x].split("|");
					for (let xx = 0; xx < cells.length; xx++) {
						row_CSV[x].push(cells[xx].trim());
					}
				}
				let csv_Board = row_CSV[0].indexOf("Pattern");
				let csv_Ref = row_CSV[0].indexOf("Designator");
				let csv_PosX = row_CSV[0].indexOf("X");
				let csv_PosY = row_CSV[0].indexOf("Y");
				let csv_Rotation = row_CSV[0].indexOf("Rotation");
				let csv_PartNumber = row_CSV[0].indexOf("Part Name");
				let csv_Head = row_CSV[0].indexOf("Head");
				let csv_Feeder = row_CSV[0].indexOf("Slot");
				let csv_Holder = row_CSV[0].indexOf("NHP");
				let csv_Nozzle = row_CSV[0].indexOf("Nozzle");
				// Generator CAD
				let sumCad = 0;
				let table = document.createElement("table");
				let headerRow = table.insertRow();
				let headers = ["Board", "Location Name", "X", "Y", "Angle", "Part Number", "Mouter", "Feeder", "Holder", "Nozzle"];
				headers.forEach(headerText => {
					let th = document.createElement("th");
					th.textContent = headerText;
					headerRow.appendChild(th);
				});
				let mark = [
					[
						document.getElementById("mark-X1").value.trim(),
						document.getElementById("mark-Y1").value.trim()
					],
					[
						document.getElementById("mark-X2").value.trim(),
						document.getElementById("mark-Y2").value.trim()
					]
				]
				for (let i = 0; i < 2; i++) {
					let row = table.insertRow();
					row.insertCell().textContent = "0";
					row.insertCell().textContent = "Mark" + (i + 1);
					row.insertCell().textContent = mark[i][0];
					row.insertCell().textContent = mark[i][1];
					row.insertCell().textContent = "0";
					row.insertCell().textContent = "Mark";
					row.insertCell().textContent = "0";
					row.insertCell().textContent = "0";
					row.insertCell().textContent = "0";
					row.insertCell().textContent = "0";
				}
				for (let i = 1; i < row_CSV.length; i++) {
					sumCad++;
					let machine = row_CSV[i][csv_Head] - Math.floor(row_CSV[i][csv_Head] / 2);
					let feeder = row_CSV[i][csv_Feeder].replace(/^.*0+/, "");
					let row = table.insertRow();
					row.insertCell().textContent = row_CSV[i][csv_Board];
					row.insertCell().textContent = row_CSV[i][csv_Ref];
					row.insertCell().textContent = row_CSV[i][csv_PosX];
					row.insertCell().textContent = row_CSV[i][csv_PosY];
					row.insertCell().textContent = row_CSV[i][csv_Rotation];
					row.insertCell().textContent = row_CSV[i][csv_PartNumber];
					row.insertCell().textContent = "M" + machine + "T" + row_CSV[i][csv_Head];
					row.insertCell().textContent = "F0" + feeder;
					row.insertCell().textContent = "H" + row_CSV[i][csv_Holder];
					row.insertCell().textContent = "N" + row_CSV[i][csv_Nozzle];
				}
				document.getElementById("txtExport").innerHTML = "";
				document.getElementById("txtExport").appendChild(table);
				document.getElementById("total-cad").innerText = sumCad;
			});
		</script>
	</body>
</html>
