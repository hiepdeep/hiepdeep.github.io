<!DOCTYPE html>
<html lang="vn">
	<head>
		<meta charset="UTF-8">
		<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
		<meta content="width=device-width, initial-scale=1.0" name="viewport">
		<link rel="icon" href="https://hiepdeep.github.io/library/favicon/logo-light.ico">
		<title>学汉字 | Xué Hànzì</title>
		<link rel="stylesheet" href="https://hiepdeep.github.io/library/style/style.css">
		<style type="text/css">
			body {
				font-family: "Quicksand", sans-serif;
				font-size: var(--fz-lv-4);
				color: red;
				background: var(--bg-body-blue);
				display: grid;
			}
			.box {
				width: 100%;
				max-width: 1080px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 12px;
				user-select: none;
				#header-top {
					flex-shrink: 0;
					display: flex;
					justify-content: space-between;
					align-items: center;
					gap: 12px;
					padding: 12px;
					background: var(--bg-box);
					border: 1px solid var(--bd-box);
					border-radius: var(--bdrs-lv-3);
					position: sticky;
					top: 12px;
					left: 0;
					z-index: 9999;
					.logo {
						display: flex;
						align-items: center;
						gap: 12px;
						img {
							width: auto;
							height: 30px;
						}
						span {
							color: var(--color-lv-1);
							font-size: var(--fz-lv-1);
							font-weight: 600;
						}
					}
					.nav {
						height: 100%;
						display: flex;
						gap: 6px;
						li {
							a {
								display: block;
								height: 30px;
								line-height: 30px;
								padding: 0 12px;
								font-size: var(--fz-lv-3);
								color: var(--color-lv-1);
								border-radius: var(--bdrs-lv-4);
								&:hover, &.focus {
									color: hsl(var(--hue-saturation-gray), 95%);
									background: hsl(var(--hue-saturation-orange), 50%);
								}
							}
						}
					}
				}
				.main {
					#page-vocabulary {
						display: flex;
						flex-direction: column;
						gap: 12px;
						#checked-vocabulary {
							display: flex;
							justify-content: space-between;
							align-items: center;
							padding: 12px;
							background: var(--bg-box);
							border: 1px solid var(--bd-box);
							border-radius: var(--bdrs-lv-3);
							position: sticky;
							top: calc(56px + 24px);
							left: 0;
							z-index: 9999;
							.t {
								font-size: var(--fz-lv-3);
								color: var(--color-lv-1);
								font-weight: 500;
							}
							.range {
								display: flex;
								justify-content: space-between;
								align-items: center;
								gap: 12px;
								#range-vocabulary {
									-webkit-appearance: none;
									appearance: none;
									width: 300px;
									height: 8px;
									&::-webkit-progress-bar {
										background: var(--bd-box);
									}
									&::-webkit-progress-value {
										background: hsl(var(--hue-saturation-teal), 50%);
									}
								}
								.checked-total {
									font-size: var(--fz-lv-4);
									color: var(--color-lv-1);
								}
							}
						}
						#vocabularys {
							display: grid;
							grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
							grid-gap: 12px;
							.item {
								display: flex;
								flex-direction: column;
								justify-content: space-between;
								align-items: center;
								padding: 12px;
								position: relative;
								color: var(--color-lv-2);
								background: var(--bg-box);
								border: 1px solid var(--bd-box);
								border-radius: var(--bdrs-lv-3);
								.hanzi {
									font-family: "Noto Serif SC", serif;
									font-size: 40px;
								}
								.pinyin, .vietnamse {
									font-size: 14px;
								}
								.bottom {
									margin-top: 12px;
									display: flex;
									justify-content: space-between;
									align-items: center;
									width: 100%;
									.label {
										line-height: 24px;
										padding: 0 6px;
										font-size: 10px;
										font-weight: 500;
										color: hsl(var(--hue-saturation-blue), 30%);
										background: hsl(var(--hue-saturation-blue), 90%);
										border: 1px solid hsl(var(--hue-saturation-blue), 85%);
										border-radius: var(--bdrs-lv-4);
									}
									button {
										width: 26px;
										height: 100%;
										border-radius: var(--bdrs-lv-4);
										&.learned {
											color: hsl(var(--hue-saturation-teal), 30%);
											background: hsl(var(--hue-saturation-teal), 90%);
											border: 1px solid hsl(var(--hue-saturation-teal), 85%);
										}
									}
								}
							}
						}
					}
				}
			}
			@media (max-width: 630px) {
				.box {
					flex-direction: column;
					#header-top {
						flex-direction: column;
					}
					.main {
						#page-vocabulary {
							#checked-vocabulary {
								top: calc(98px + 24px);
								.range {
									#range-vocabulary {
										width: 200px;
									}
								}
							}
						}
					}
				}
			}
			@media (max-width: 470px) {
				.box {
					#header-top {
						.nav {
							display: none;
						}
					}
					.main {
						#page-vocabulary {
							#checked-vocabulary {
								top: calc(56px + 24px);
								.range {
									#range-vocabulary {
										width: 200px;
									}
								}
							}
						}
					}
				}
			}
			@media (max-width: 440px) {
				.box {
					.main {
						#page-vocabulary {
							#checked-vocabulary {
								.range {
									#range-vocabulary {
										width: 100px;
									}
								}
							}
						}
					}
				}
			}
		</style>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
		<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
	</head>
	<body>
		<div class="box">
			<div id="header-top">
				<a href="" class="logo">
					<img src="https://hiepdeep.github.io/library/pictures/svg/books.svg" alt="">
					<span class="text">Xué Hànzì</span>
				</a>
				<div class="nav">
					<li><a href="javascript:;" class="focus">Từ vựng</a></li>
					<li><a href="javascript:;">Mẫu câu</a></li>
					<li><a href="javascript:;">Đoạn văn</a></li>
					<li><a href="javascript:;">Đoạn hội thoại</a></li>
				</div>
			</div>
			<div class="main">
				<div id="page-vocabulary">
					<div id="checked-vocabulary">
						<span class="t">Từ vựng đã học</span>
						<div class="range">
							<progress id="range-vocabulary" name="range-vocabulary" value="0"></progress>
							<span class="checked-total">0</span>
						</div>
					</div>
					<div id="vocabularys"></div>
				</div>
			</div>
		</div>
		<script>
			console.clear();
			const app = firebase.initializeApp({
				databaseURL: "https://xue-hanzi-default-rtdb.asia-southeast1.firebasedatabase.app"
			});
			const database = firebase.database();
			const db_vocabularys = "vocabularys";
			const progressBar = document.getElementById("range-vocabulary");
			const progressText = document.querySelector(".checked-total");
			const index_vocabulary = document.getElementById("vocabularys");
			document.addEventListener("DOMContentLoaded", () => {
				render_vocabularys();
			});
			async function render_vocabularys() {
				try {
					const snapshot = await database.ref(db_vocabularys).once("value");
					if (snapshot.exists()) {
						const data = snapshot.val() || {};
						let learnedCount = 0;
						index_vocabulary.innerHTML = "";
						Object.entries(data).forEach(([itemKey, item], index) => {
							const isLearned = item.learn === "learned";
							if (isLearned) {
								learnedCount++;
							}
							const div = document.createElement("div");
							div.classList.add("item");
							div.innerHTML = `
								<span class="pinyin">${item.pinyin}</span>
								<span class="hanzi">${item.hanzi}</span>
								<span class="vietnamese">${item.vietnamese}</span>
								<div class="bottom">
									<span class="label">${item.label}</span>
									<button btn-light-gray class="material-symbols-rounded learn-btn ${isLearned ? 'learned' : ''}" data-key="${itemKey}">${isLearned ? "star_shine" : "star"}</button>
								</div>
							`;
							index_vocabulary.appendChild(div);
						});
						const totalWords = Object.keys(data).length;
						progressBar.max = totalWords;
						progressBar.value = learnedCount;
						progressText.textContent = `${learnedCount}/${totalWords}`;
						index_vocabulary.onclick = null;
						index_vocabulary.addEventListener("click", async function(e) {
							const learnBtn = e.target.closest(".learn-btn");
							if (learnBtn) {
								const itemKey = learnBtn.getAttribute("data-key");
								const isCurrentlyLearned = learnBtn.classList.contains("learned");
								const newLearnState = isCurrentlyLearned ? "" : "learned";
								try {
									await database.ref(`${db_vocabularys}/${itemKey}`).update({
										learn: newLearnState
									});
									if (newLearnState === "learned") {
										learnBtn.classList.add("learned");
										learnBtn.textContent = "star_shine";
										learnedCount++;
										console.log("Đã học từ:", itemKey);
									} else {
										learnBtn.classList.remove("learned");
										learnBtn.textContent = "star";
										learnedCount--;
										console.log("Đã bỏ trạng thái học từ:", itemKey);
									}
									progressBar.value = learnedCount;
									progressText.textContent = `${learnedCount}/${totalWords}`;
								} catch (err) {
									console.error("Lỗi khi cập nhật database:", err);
								}
							}
						});
					} else {
						console.log("Không tìm thấy dữ liệu từ vựng nào!");
					}
				} catch (error) {
					console.error("Lỗi khi lấy dữ liệu: ", error);
				}
			}
		</script>
	</body>
</html>
