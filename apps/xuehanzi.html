<html lang="vn">

		<meta charset="UTF-8">
		<meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
		<meta content="width=device-width, initial-scale=1.0" name="viewport">
		<link rel="icon" href="https://hiepdeep.github.io/library/favicon/logo-light.ico">
		<title>Xue Hanzi</title>
		<link rel="stylesheet" href="https://hiepdeep.github.io/library/style/style.css">
		<style type="text/css">
			body {
				font-family: "Quicksand", sans-serif;
				font-size: var(--fz-lv-4);
				color: red;
				background: var(--bg-body-blue);
				display: grid;
				place-items: center;
				height: 100vh;
			}
			.box {
				width: 100%;
				max-width: 1080px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 12px;
				padding: 12px;
				user-select: none;
				#header-top {
					flex-shrink: 0;
					display: flex;
					justify-content: space-between;
					align-items: center;
					gap: 12px;
					padding: 12px;
					background: var(--bg-box);
					border: 1px solid var(--bd-box);
					border-radius: var(--bdrs-lv-3);
					.logo {
						display: flex;
						align-items: center;
						gap: 12px;
						img {
							width: auto;
							height: 30px;
						}
						span {
							color: var(--color-lv-1);
							font-size: var(--fz-lv-1);
							font-weight: 600;
						}
					}
					.nav {
						height: 100%;
						display: flex;
						gap: 6px;
						li {
							a {
								display: block;
								height: 30px;
								line-height: 30px;
								padding: 0 12px;
								font-size: var(--fz-lv-3);
								color: var(--color-lv-1);
								border-radius: var(--bdrs-lv-4);
								&:hover, &.focus {
									color: hsl(var(--hue-saturation-gray), 95%);
									background: hsl(var(--hue-saturation-orange), 50%);
								}
							}
						}
					}
				}
				.main {
					#page-vocabulary {
						display: flex;
						flex-direction: column;
						gap: 12px;
						#checked-vocabulary {
							display: flex;
							justify-content: space-between;
							align-items: center;
							padding: 12px;
							background: var(--bg-box);
							border: 1px solid var(--bd-box);
							border-radius: var(--bdrs-lv-3);
							position: sticky;
							top: 12px;
							left: 0;
							z-index: 9999;
							.t {
								font-size: var(--fz-lv-3);
								color: var(--color-lv-1);
								font-weight: 500;
							}
							.range {
								display: flex;
								justify-content: space-between;
								align-items: center;
								gap: 12px;
								#range-vocabulary {
									-webkit-appearance: none;
									appearance: none;
									width: 300px;
									height: 8px;
									&::-webkit-progress-bar {
										background: var(--bd-box);
									}
									&::-webkit-progress-value {
										background: hsl(var(--hue-saturation-teal), 50%);
									}
								}
								.checked-total {
									font-size: var(--fz-lv-4);
									color: var(--color-lv-1);
								}
							}
						}
						#vocabularys {
							display: grid;
							grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
							grid-gap: 12px;
							.item {
								display: flex;
								flex-direction: column;
								justify-content: space-between;
								align-items: center;
								padding: 12px;
								position: relative;
								color: var(--color-lv-2);
								background: var(--bg-box);
								border: 1px solid var(--bd-box);
								border-radius: var(--bdrs-lv-3);
								.hanzi {
									font-family: "Noto Serif SC", serif;
									font-size: 40px;
								}
								.pinyin, .vietnamse {
									font-size: 14px;
								}
								.bottom {
									margin-top: 12px;
									display: flex;
									justify-content: space-between;
									align-items: center;
									width: 100%;
									.label {
										line-height: 24px;
										padding: 0 6px;
										color: hsl(var(--hue-saturation-blue), 30%);
										background: hsl(var(--hue-saturation-blue), 90%);
										border: 1px solid hsl(var(--hue-saturation-blue), 85%);
										border-radius: var(--bdrs-lv-4);
									}
									button {
										height: 100%;
										padding: 0 6px;
										border-radius: var(--bdrs-lv-4);
									}
								}
							}
						}
					}
				}
			}
			@media (max-width: 630px) {
				.box {
					flex-direction: column;
					#header-top {
						flex-direction: column;
					}
					.main {
						#page-vocabulary {
							#checked-vocabulary {
								.range {
									#range-vocabulary {
										width: 200px;
									}
								}
							}
						}
					}
				}
			}
			@media (max-width: 470px) {
				.box {
					#header-top {
						.nav {
							display: none;
						}
					}
				}
			}
			@media (max-width: 440px) {
				.box {
					.main {
						#page-vocabulary {
							#checked-vocabulary {
								.range {
									#range-vocabulary {
										width: 100px;
									}
								}
							}
						}
					}
				}
			}
		</style>
	</head>
